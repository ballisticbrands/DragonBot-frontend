<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logos/dragonbot_fire.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The description + title get overwritten by main.tsx once the
         brand is detected from window.location.hostname. Kept as a
         DragonBot fallback for anything that renders before the SPA
         mounts. -->
    <meta name="description" content="DragonBot is a hosted MCP server for Amazon sellers." />
    <title>DragonBot — Amazon Seller MCP for AI agents</title>
    <!-- GA4 + Microsoft Clarity are injected at runtime from
         src/main.tsx once we know which brand is being served. The
         inline snippets used to live here but they hardcoded a single
         brand's IDs, which doesn't work now that this bundle serves
         multiple hosts. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
